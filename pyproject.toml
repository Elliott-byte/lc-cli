[project]
name = "lc-cli"
version = "0.7.70"
description = "Practice LeetCode from your terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "textual>=0.79",
    # Syntax highlighting in the built-in edit screen. Grammars are separate
    # packages textual imports by name; python covers the solving language,
    # everything else falls back to plain text. (Grammar sdists do not build
    # from source — wheel-first upstreams — so the brew formula ships the
    # python one as a platform wheel.)
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "browser-cookie3>=0.19",
]

[project.scripts]
lc = "lc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lc"]
