[project]
name = "lc-cli"
version = "0.5.4"
description = "Practice LeetCode from your terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "textual>=0.79",
    "browser-cookie3>=0.19",
]

[project.scripts]
lc = "lc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lc"]
